<div class="app">
  <aside class="sidebar">

      <span class="brand-text"><strong>ByteSize</strong><span>Control panel</span></span>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-route="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Studio</span></a>
      <a href="#/look" data-route="look"><svg class="icon" aria-hidden="true"><use href="#i-palette"/></svg><span>Look and voice</span></a>

      <a href="#/videos" data-route="videos"><svg class="icon" aria-hidden="true"><use href="#i-film"/></svg><span>Videos</span></a>

    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div id="view"></div>
