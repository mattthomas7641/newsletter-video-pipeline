<!doctype html>
<!--
  ByteSize explainer (1080x1920), 35-45 s, one scene plan per render.
  The "explainer" video style: no avatar, no footage — an editorial explainer
  whose scenes are pictograms, charts, diagrams and device wireframes with
  the text as their labels. Design system: DESIGN.md next to this file;
  pictograms: icons.js.

  Driven by newsletter_video/explainer_builder.py, which per video:
    - writes assets/voice.wav (the narration)
    - renders with --variables-file holding {"story": "<json>"}
  The `story` default below is a real sample so Studio preview and
  `npx hyperframes check` work without the pipeline (assets/voice.wav is
  gitignored; drop any wav there for preview).

  story JSON shape:
    { "theme": "light"|"dark", "kicker": str, "duration": seconds,
      "scenes": [ { "type": <scene type>, "start": s, "end": s, ...fields,
                    cue fields: "emphasisAt" | "countAt" | "cues": [s, ...] } ],
      "captions": [ { "words": [str], "at": [s], "start": s, "end": s } ] }
  Scene fields per type are the validated fields of newsletter_video/scene_plan.py.
-->

      /* ---- tokens (DESIGN.md) --------------------------------------------- */
      :root {
        --bg: #f6f4ee;

        --t-display: 140px;

      :root[data-theme="dark"] {
        --bg: #111318;
        --ink: #f3f1ea;
        --ink-2: #a3a8b3;
        --hair: rgba(243, 241, 234, 0.18);
        --dot: rgba(243, 241, 234, 0.1);
        --accent: #7b96ff;
        --accent-soft: rgba(123, 150, 255, 0.18);
        --bar: #2a2f3a;

        --screen: #050608;
        --screen-ink: #f3f1ea;

      /* ---- cinematic look (DESIGN.md "Cinematic look") ----------------------
         A near-black ground with a perspective grid floor, glow accents from
         the recipe's palette (--accent is the text-safe tone, --glow-* the raw
         colours), vignette and static grain. --glow-1..4 are set from
         story.palette at build time; the defaults are a neon set. */
      :root[data-theme="cinematic"] {
        --bg: #050509;
        --ink: #f4f3ff;
        --ink-2: #9aa0b8;
        --hair: rgba(190, 196, 230, 0.22);
        --dot: rgba(190, 196, 230, 0.08);
        --accent: #ff8a2a;
        --accent-soft: rgba(255, 138, 42, 0.2);
        --bar: #1b1f33;
        --panel: rgba(18, 21, 40, 0.72);
        --screen: #03040c;
        --screen-ink: #f4f3ff;
        --glow-1: #ff7a1a;
        --glow-2: #ff3d8a;
        --glow-3: #8b5cff;
        --glow-4: #22d3ee;
        --glow-rgb: 255, 122, 26;
        --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025));
        --glass-edge: rgba(220, 226, 255, 0.26);
      }
      :root[data-theme="cinematic"] #paper {
        /* the dot grid becomes a faint line grid on the upper ground */
        background-image:
          linear-gradient(var(--dot) 1px, transparent 1px),
          linear-gradient(90deg, var(--dot) 1px, transparent 1px);
        background-size: 108px 108px;
        background-position: 54px 54px;
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0) 70%);
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0) 70%);
      }
      #floor,
      #haze,
      #vignette,
      #grain {
        display: none;
        position: absolute;
        pointer-events: none;
      }
      :root[data-theme="cinematic"] #floor,
      :root[data-theme="cinematic"] #haze,
      :root[data-theme="cinematic"] #vignette,
      :root[data-theme="cinematic"] #grain {
        display: block;
      }
      #floor {
        /* a perspective grid floor under the stage, receding to the horizon at y~1150 */
        left: -400px;
        right: -400px;
        top: 1080px;
        height: 1100px;
        background-image:
          linear-gradient(rgba(var(--glow-rgb), 0.28) 2px, transparent 2px),
          linear-gradient(90deg, rgba(var(--glow-rgb), 0.28) 2px, transparent 2px);
        background-size: 140px 140px;
        transform-origin: 50% 0%;
        transform: perspective(900px) rotateX(64deg);
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 22%, rgba(0, 0, 0, 0.5) 80%, rgba(0, 0, 0, 0) 100%);
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 22%, rgba(0, 0, 0, 0.5) 80%, rgba(0, 0, 0, 0) 100%);
      }
      #haze {
        /* the accent's light pooling on the floor, and a cool counter-glow above */
        inset: 0;
        background:
          radial-gradient(60% 24% at 50% 66%, rgba(var(--glow-rgb), 0.3), rgba(var(--glow-rgb), 0) 100%),
          radial-gradient(70% 30% at 50% 8%, rgba(60, 70, 140, 0.35), rgba(60, 70, 140, 0) 100%);
      }
      #vignette {
        inset: 0;
        background: radial-gradient(75% 60% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      #grain {
        /* static film grain: a fixed-seed turbulence tile (deterministic) */
        inset: 0;
        opacity: 0.16;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23g)'/></svg>");
        background-size: 220px 220px;
      }
      /* type: the cinematic look sets headings in the heavy sans, like a motion-graphics title */
      :root[data-theme="cinematic"] .display,
      :root[data-theme="cinematic"] .h1,
      :root[data-theme="cinematic"] .h2 {
        font-family: var(--sans);
        font-weight: 800;

      :root[data-theme="cinematic"] .stat .stat-fill,

      :root[data-theme="cinematic"] .diagram .node.lit,

        border-color: var(--accent);
        box-shadow: 0 0 30px rgba(var(--glow-rgb), 0.45);
      }
      :root[data-theme="cinematic"] .diagram .flow .connector path,
      :root[data-theme="cinematic"] .diagram .hub svg path,
      :root[data-theme="cinematic"] .chart .line-svg .line {
        filter: drop-shadow(0 0 8px rgba(var(--glow-rgb), 0.8));
      }
      :root[data-theme="cinematic"] .device .frame.phone::before {
        background: var(--glass-edge);
      }
      :root[data-theme="cinematic"] .device .frame.terminal {
        border-color: var(--glass-edge);

      :root[data-theme="cinematic"] .diagram .hub .center,

      :root[data-theme="cinematic"] .outro .pill {
        box-shadow: 0 0 30px rgba(var(--glow-rgb), 0.4), inset 0 0 20px rgba(var(--glow-rgb), 0.15);
      }
      :root[data-theme="cinematic"] .sweep {
        background: rgba(255, 255, 255, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      #paper {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--dot) 1.6px, transparent 1.9px);
        background-size: 48px 48px;
        background-position: 16px 16px;
      }

      /* ---- chrome: kicker row + progress rule (y 176-230) ----------------- */
      #chrome {
        position: absolute;
        top: 176px;
        left: var(--m);
        width: var(--content-w);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--mono);
        font-size: var(--t-label);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-2);
        line-height: 1;
      }
      #counter {
        font-variant-numeric: tabular-nums;
      }
      #rule {
        position: absolute;
        top: 228px;
        left: var(--m);
        width: var(--content-w);
        height: 2px;
        background: var(--hair);
      }
      #progress {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
      }

      /* ---- stage: scenes live here (y 272-1336) ---------------------------- */
      #stage {
        position: absolute;
        top: 272px;
        left: var(--m);
        width: var(--content-w);
        height: 1064px;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        display: flex;
        flex-direction: column;
      }
      .scene > .head {
        flex: 0 0 auto;
      }
      .scene > .hero {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform-origin: 50% 50%;
      }
      .scene > .foot {
        flex: 0 0 auto;
      }
      #wipe {
        position: absolute;
        left: 0;
        width: 100%;
        top: 0;
        height: 4px;
        background: var(--accent);
        opacity: 0;
        pointer-events: none;
      }
      /* ---- style-library hooks (scene `style` knobs; inert without them) --- */
      #wipe-v {
        position: absolute;
        top: 0;
        height: 100%;
        left: 0;
        width: 4px;
        background: var(--accent);
        opacity: 0;
        pointer-events: none;
      }
      #field {
        /* a colour band behind the stage only, so chrome and captions keep their ground */
        position: absolute;
        left: 0;
        right: 0;
        top: 248px;
        height: 1112px;
        background: var(--accent);
        opacity: 0;
        pointer-events: none;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: var(--accent);
        opacity: 0;
        pointer-events: none;
      }
      .st-caps .display,
      .st-caps .h1,
      .st-caps .h2,

        text-transform: uppercase;

      }
      .st-field {
        --ink: #ffffff;
        --ink-2: rgba(255, 255, 255, 0.78);

      /* type roles */
      .label {
        font-family: var(--mono);
        font-size: var(--t-label);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;

      }
      .statement .hero {
        justify-content: center;
        gap: var(--s-12);
        padding: var(--s-6) 0;
      }
      .outro .hero {
        justify-content: center;
        gap: var(--s-4);
        padding: var(--s-3) 0;
      }
      .outro .hero .icon {
        margin: 0 0 var(--s-2);
      }

      /* stat */
      .stat .value {
        font-size: var(--t-stat);
        transform-origin: left center;
        margin: var(--s-2) 0;
      }
      .stat .stat-rule {
        position: relative;
        width: 100%;
        height: 6px;
        background: var(--bar);
        overflow: hidden;
      }
      .stat .stat-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .stat .trend {
        display: flex;
        align-items: flex-end;
        gap: var(--s-2);
        height: 380px;
        margin-top: var(--s-6);
      }
      /* a lighter band that travels along the accent rule / lead bar while a stat holds */
      .sweep {
        position: absolute;
        top: 0;
        left: 0;
        width: 140px;
        height: 100%;
        background: rgba(255, 255, 255, 0.45);
        opacity: 0;
        pointer-events: none;
      }
      :root[data-theme="dark"] .sweep {
        background: rgba(17, 19, 24, 0.35);
      }
      .ping {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid var(--accent);
        opacity: 0;
        pointer-events: none;
        transform-origin: center center;
      }
      .stat .trend .col {
        flex: 1 1 0;
        background: var(--bar);
        transform: scaleY(0);
        transform-origin: bottom center;
      }
      .stat .trend .col.lead {
        background: var(--accent);
      }
      .stat .ring-wrap {
        display: grid;
        place-items: center;
      }
      .stat .ring-wrap .ring {
        grid-area: 1 / 1;
        width: 700px;
        height: 700px;
      }
      .stat .ring-wrap .value {
        grid-area: 1 / 1;
        margin: 0;
        text-align: center;
        transform-origin: center center;
      }
      .ring circle {
        fill: none;
        stroke-width: 22;
      }
      .ring .track {
        stroke: var(--bar);
      }
      .ring .fill {
        stroke: var(--accent);
        stroke-linecap: butt;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      /* comparison */
      .comparison .hero {
        justify-content: center;
      }
      .comparison .columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); /* tracks never grow for nowrap figures */
        align-items: start;
        column-gap: var(--s-2);
      }
      .comparison .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .comparison .vs {
        align-self: center;
        text-align: center;
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-2);
        letter-spacing: 0.14em;
      }
      .comparison .object {
        display: grid;
        place-items: center;
        width: 374px;
        height: 374px;
        position: relative;
      }
      .comparison .disc {
        grid-area: 1 / 1;
        border-radius: 50%;
        background: var(--bar);
        transform: scale(0);
      }
      .comparison .col.lead .disc {
        background: var(--accent);
      }
      .comparison .tile {
        width: 340px;
        height: 340px;
        border: 3px solid var(--hair);
        display: grid;
        place-items: center;
      }
      .comparison .col .label {
        margin-top: var(--s-4);
      }
      .comparison .col .value {
        font-size: var(--t-value);
        margin-top: var(--s-2);
        width: 100%;
        text-align: center;
      }
      .comparison .col.lead .value {
        color: var(--accent);
      }
      .comparison .col .note {
        margin-top: var(--s-2);
        font-size: 40px;
        line-height: 1.25;
        min-height: 100px;
      }

      /* list */
      .list .rows {
        margin-top: var(--s-4);
      }
      .list .row {
        display: grid;
        grid-template-columns: 110px 1fr;
        column-gap: var(--s-3);
        align-items: center;
        padding: var(--s-3) 0;
        border-top: 2px solid var(--hair);
        min-height: 180px;
      }
      .list .row .index {
        font-family: var(--mono);
        font-size: var(--t-label);
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .list .row .body {
        font-size: 60px;
      }
      /* Short lists fill the stage instead of floating in it. */
      .list.few .row {
        grid-template-columns: 150px 1fr;
        min-height: 250px;
      }
      .list.few .row .body {
        font-size: 76px;
      }
      .list.two .row {
        grid-template-columns: 170px 1fr;
        min-height: 320px;
      }
      .list.two .row .body {
        font-size: 84px;
      }

      /* timeline */
      .timeline .steps {
        position: relative;
        margin-top: var(--s-4);
        padding-left: 80px;
      }
      .timeline .rail {
        position: absolute;
        left: 22px;
        top: 28px;
        bottom: 28px;
        width: 4px;
        background: var(--hair);
      }
      .timeline .rail-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform: scaleY(0);
        transform-origin: top center;
      }
      .timeline .marker {
        position: absolute;
        left: 0;
        top: 8px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid var(--accent);
        background: var(--accent-soft);
        opacity: 0;
      }
      .timeline .step {
        position: relative;
        padding: var(--s-2) 0 var(--s-4);
      }
      .timeline .node {
        position: absolute;
        left: -68px;
        top: calc(var(--s-2) + 10px);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--bg);
        border: 4px solid var(--ink-2);
        transform-origin: center center;
      }
      .timeline .step .body {
        margin-top: var(--s-1);
        font-size: 54px;
      }

      /* quote */
      .quote .mark {
        font-family: var(--serif);
        font-size: 220px;
        line-height: 0.7;
        color: var(--accent);
        height: 150px;
      }
      .quote .text {
        font-family: var(--serif);
        font-style: italic;
        font-size: var(--t-quote);
        line-height: 1.15;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      .quote .attribution {
        margin-top: var(--s-6);
        padding-top: var(--s-3);
        border-top: 2px solid var(--hair);
      }

      /* chart: bars */
      .chart .bars {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--s-3);
      }
      .chart .bar-row {
        display: grid;
        grid-template-columns: 290px 1fr;
        column-gap: var(--s-3);
        align-items: center;
      }
      .chart .bar-label {
        font-family: var(--mono);
        font-size: var(--t-label);
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--ink-2);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
      }
      .chart .bar-track {
        position: relative;
        height: 96px;
      }
      .chart .bar {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: calc(100% - 160px);
        background: var(--bar);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .chart .lead .bar,
      .chart .lead .column {
        background: var(--accent);
      }
      .chart .bar-value {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        padding-left: var(--s-2);
        font-size: 44px;
      }
      .chart .baseline {
        margin-top: var(--s-4);
        height: 2px;
        background: var(--hair);
      }
      /* chart: columns */
      .chart .columns {
        display: flex;
        align-items: flex-end;
        gap: var(--s-4);
        height: 640px;
      }
      .chart .column-cell {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
      }
      .chart .column-value {
        text-align: center;
        font-size: 48px;
        margin-bottom: var(--s-2);
      }
      .chart .column {
        width: 100%;
        background: var(--bar);
        transform: scaleY(0);
        transform-origin: bottom center;
      }
      .chart .column-labels {
        display: flex;
        gap: var(--s-4);
        margin-top: var(--s-3);
      }
      .chart .column-label {
        flex: 1 1 0;
        text-align: center;
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-2);
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
      }
      /* chart: line */
      .chart .line-wrap {
        width: 100%;
      }
      .chart .line-svg {
        display: block;
        width: 100%;
        height: 640px;
        overflow: visible;
      }
      .chart .line-svg .area {
        fill: var(--accent-soft);
        opacity: 0;
      }
      .chart .line-svg .line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chart .line-svg .pt {
        fill: var(--bg);
        stroke: var(--accent);
        stroke-width: 6;
        transform-origin: center center;
        transform-box: fill-box;
      }
      .chart .line-svg .pt.lead {
        fill: var(--accent);
      }
      .chart .line-svg .grid {
        stroke: var(--hair);
        stroke-width: 2;
      }
      .chart .line-callout {
        font-size: 56px;
        text-align: right;
        margin-top: var(--s-3);
      }
      /* chart: dots (waffle of 100) */
      .chart .dots {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 14px;
        width: 700px;
      }
      .chart .dotc {
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--bar);
      }
      .chart .legend {
        margin-top: var(--s-6);
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .chart .legend-row {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        font-size: 48px;
      }
      .chart .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--bar);
        flex: 0 0 auto;
      }
      .chart .legend-value {
        margin-left: auto;
        font-size: 52px;
      }

      /* diagram */
      .diagram .hero {
        justify-content: center;
      }
      .diagram .node {
        position: relative;
        border: 3px solid var(--ink-2);
        background: var(--panel);
        padding: var(--s-4) var(--s-6);
        will-change: transform, opacity;
      }
      .diagram .node.lit {
        border-color: var(--accent);
      }
      .diagram .node .label {
        color: var(--accent);
      }
      .diagram .node .body {
        margin-top: var(--s-1);
        font-size: 48px;
      }
      .diagram .flow {
        display: flex;
        flex-direction: column;
      }
      .diagram .flow .connector {
        width: 100%;
        height: 96px;
        display: block;
        overflow: visible;
      }
      .diagram .flow .connector path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
      }
      .diagram .stack {
        display: flex;
        flex-direction: column-reverse;
        gap: var(--s-2);
      }
      .diagram .stack .node {
        transform-origin: bottom center;
      }
      .diagram .stack .node.top {
        border-color: var(--accent);
      }
      .diagram .hub {
        position: relative;
        width: 100%;
        height: 900px;
      }
      .diagram .hub svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .diagram .hub svg path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 6;
      }
      .diagram .hub .node {
        position: absolute;
        width: 280px;
        padding: var(--s-3) var(--s-3);
        text-align: center;
        transform-origin: center center;
      }
      .diagram .hub .node .body {
        font-size: 40px;
      }
      .diagram .hub .center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 240px;
        height: 240px;
        margin: -120px 0 0 -120px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        text-align: center;
        font-family: var(--serif);
        font-size: 52px;
        line-height: 1.05;
        padding: var(--s-3);
        transform-origin: center center;
      }
      :root[data-theme="dark"] .diagram .hub .center {
        color: #111318;
      }
      .diagram .funnel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--s-2);
      }
      .diagram .funnel .band {
        position: relative;
        height: 200px;
        border: 4px solid transparent;
        background: var(--bar);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--s-1);
        padding: 0 var(--s-4);
        transform-origin: top center;
        text-align: center;
      }
      .diagram .funnel .band.lead {
        background: var(--accent);
        color: #fff;
      }
      :root[data-theme="dark"] .diagram .funnel .band.lead {
        color: #111318;
      }
      .diagram .funnel .band .label {
        color: inherit;
        opacity: 0.85;
      }
      .diagram .funnel .band .body {
        font-size: 48px;
        white-space: nowrap;
      }
      .diagram .funnel .band.lit {
        outline: 4px solid var(--accent);
        outline-offset: -4px;
      }

      /* device wireframes */
      .device .hero {
        justify-content: center;
        align-items: center;
      }
      .device .frame {
        border: 4px solid var(--ink);
        background: var(--panel);
        position: relative;
        overflow: hidden;
        transform-origin: center center;
      }
      .device .frame.phone {
        width: 520px;
        height: 940px;
        border-radius: 56px;
        padding: 96px 32px 40px;
      }
      .device .frame.phone::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 24px;
        width: 150px;
        height: 36px;
        margin-left: -75px;
        border-radius: 18px;
        background: var(--ink);
      }
      .device .frame.laptop {
        width: 820px;
        height: 620px;
        border-radius: 24px 24px 0 0;
        padding: 0;
      }
      .device .lid {
        width: 820px;
        height: 22px;
        background: var(--ink);
        border-radius: 0 0 20px 20px;
      }
      .device .frame.laptop .screen,
      .device .frame.terminal .screen {
        height: 100%;
      }
      .device .frame.terminal,
      .device .frame.chat {
        width: 820px;
        min-height: 520px;
        border-radius: 24px;
      }
      .device .frame.terminal {
        background: var(--screen);
        color: var(--screen-ink);
        border-color: var(--screen);
      }
      :root[data-theme="dark"] .device .frame.terminal {
        border-color: var(--hair); /* the screen is as dark as the ground: keep an edge */
      }
      .device .titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 72px;
        padding: 0 var(--s-3);
        border-bottom: 2px solid var(--hair);
        font-family: var(--mono);
        font-size: 30px;
        color: var(--ink-2);
        letter-spacing: 0.06em;
      }
      .device .frame.terminal .titlebar {
        border-color: rgba(243, 241, 234, 0.18);
        color: rgba(243, 241, 234, 0.6);
      }
      .device .titlebar .dotz {
        display: flex;
        gap: 8px;
      }
      .device .titlebar .dotz i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--bar);
        display: block;
      }
      .device .titlebar .name {
        margin-left: var(--s-2);
      }
      .device .lines {
        padding: var(--s-4);
        display: flex;
        flex-direction: column;
        gap: var(--s-3);
      }
      .device .line {
        font-family: var(--sans);
        font-size: 42px;
        font-weight: 500;
        line-height: 1.25;
        will-change: transform, opacity;
      }
      .device .frame.phone .line {
        border: 2px solid var(--hair);
        border-radius: 20px;
        padding: var(--s-3);
        font-size: 38px;
      }
      .device .frame.phone .line::before {
        content: "";
        display: block;
        width: 72px;
        height: 10px;
        border-radius: 5px;
        background: var(--accent);
        margin-bottom: 14px;
      }
      .device .frame.laptop .line {
        display: grid;
        grid-template-columns: 1fr 160px;
        align-items: center;
        gap: var(--s-3);
        padding-bottom: var(--s-2);
        border-bottom: 2px solid var(--hair);
      }
      .device .frame.laptop .line .meter {
        height: 14px;
        background: var(--bar);
        position: relative;
        overflow: hidden;
      }
      .device .frame.laptop .line .meter i {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .device .line.lit {
        color: var(--accent);
      }
      .device .frame.terminal .line.lit {
        color: var(--accent);
      }
      .chart .bar-row.lit .bar-label,
      .chart .column-cell.lit .column-value {
        color: var(--accent);
      }
      .device .frame.terminal .line {
        font-family: var(--mono);
        font-size: 42px;
        white-space: pre;
        overflow: hidden;
        color: var(--screen-ink);
      }
      .device .frame.terminal .line .caret {
        display: inline-block;
        width: 24px;
        height: 44px;
        background: var(--accent);
        vertical-align: -6px;
        opacity: 0;
      }
      .device .frame.chat .line {
        max-width: 78%;
        padding: var(--s-3) var(--s-4);
        border-radius: 28px;
        background: var(--bar);
      }
      .device .frame.chat .line.me {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
      }
      :root[data-theme="dark"] .device .frame.chat .line.me {
        color: #111318;
      }
      .device .caption-label {
        margin-top: var(--s-4);
        text-align: center;
      }

      /* outro CTA */
      .outro .cta {
        display: flex;
        align-items: center;
        gap: var(--s-4);
        margin-top: var(--s-3);
      }
      .outro .pill {
        display: inline-flex;
        align-items: center;
        gap: var(--s-2);
        padding: var(--s-2) var(--s-4);
        border-radius: 999px;
        border: 4px solid var(--accent);
        color: var(--accent);
        font-family: var(--sans);
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .outro .pill .arrow {
        display: inline-block;
        will-change: transform;
      }
      .outro .typing {
        display: flex;
        gap: 14px;
        margin-top: var(--s-4);
      }
      .outro .typing i {
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.3;
      }

      /* ---- rich scenes (cinematic look; they render in every theme) ------------ */
      /* object3d: a Three.js canvas in the hero with an HTML legend under it */
      .object3d .hero {
        justify-content: flex-start;
        padding-top: var(--s-3); /* the hold's push never lets the canvas touch the title */
      }
      .object3d .three-slot {
        position: relative;
        width: 820px;
        height: 560px;
        flex: 0 0 auto;
      }
      .object3d .three-slot canvas {
        display: block;
        width: 820px;
        height: 560px;
      }
      .object3d .legend {
        margin-top: var(--s-2);
        display: flex;
        flex-direction: column;
      }
      .object3d .legend .row {
        display: grid;
        grid-template-columns: 44px 1fr;
        column-gap: var(--s-3);
        align-items: center;
        min-height: 64px;
        padding: var(--s-1) 0;
        border-top: 2px solid var(--hair);
        will-change: transform, opacity;
      }
      .object3d .legend .row .swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }
      .object3d .legend .row .body {
        font-size: 40px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
      }
      .object3d .legend .row .body b {
        font-weight: 700;
        margin-right: 0.4em;
      }
      .object3d .legend.many .row {
        min-height: 56px;
      }
      .object3d .legend.many .row .body {
        font-size: 36px;
      }
      .object3d .bar-labels {
        display: flex;
        gap: var(--s-3);
        margin-top: var(--s-2);
      }
      .object3d .bar-labels .cell {
        flex: 1 1 0;
        text-align: center;
        will-change: transform, opacity;
      }
      .object3d .bar-labels .cell .num {
        font-size: 48px;
        margin-bottom: var(--s-1);
      }
      .object3d .bar-labels .cell.lead .num {
        color: var(--accent);
      }
      .object3d .bar-labels .cell .column-label {
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-2);
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
      }

      /* depth: layered planes the camera pushes through */
      .depth .hero {
        justify-content: center;
      }
      .depth .world {
        position: relative;
        width: 820px;
        height: 860px;
        perspective: 1100px;
        perspective-origin: 50% 42%;
        overflow: hidden;
      }
      .depth .plane {
        position: absolute;
        left: 50%;
        top: 340px;
        width: 640px;
        margin-left: -320px;
        padding: var(--s-4) var(--s-6);
        border: 3px solid var(--hair);
        background: var(--panel);
        border-radius: 28px;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      :root[data-theme="cinematic"] .depth .plane {
        background: var(--glass);
        border-color: var(--glass-edge);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .depth .plane .label {
        color: var(--accent);
      }
      .depth .plane .body {
        margin-top: var(--s-1);
        font-size: 52px;
        line-height: 1.2;
      }
      .depth .plane.lit {
        border-color: var(--accent);
      }
      :root[data-theme="cinematic"] .depth .plane.lit {
        box-shadow: 0 0 44px rgba(var(--glow-rgb), 0.5);
      }
      .depth .plane .idx {
        position: absolute;
        right: var(--s-4);
        top: var(--s-3);
        font-family: var(--mono);
        font-size: var(--t-label);
        color: var(--ink-2);
      }

      /* kinetic: glowing type */
      .kinetic .hero {
        justify-content: center;
        gap: var(--s-3);
      }
      .kinetic .value {
        font-size: 420px;
        color: var(--accent);
        transform-origin: left center;
        margin: -0.06em 0 0 -0.03em;
      }
      :root[data-theme="cinematic"] .kinetic .value {
        text-shadow: 0 0 60px rgba(var(--glow-rgb), 0.75), 0 0 140px rgba(var(--glow-rgb), 0.35);
      }
      .kinetic .line {
        font-family: var(--sans);
        font-weight: 800;
        font-size: 112px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .kinetic .line .word {
        margin-right: 0.26em;
      }
      :root[data-theme="cinematic"] .kinetic .line {
        text-shadow: 0 0 30px rgba(244, 243, 255, 0.35);
      }
      :root[data-theme="cinematic"] .kinetic .line.lit {
        color: var(--accent);
        text-shadow: 0 0 36px rgba(var(--glow-rgb), 0.8);
      }
      .kinetic .line.lit {
        color: var(--accent);
      }
      .kinetic .underline {
        width: 100%;
        height: 6px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
        box-shadow: 0 0 24px var(--accent);
      }

      /* glass: a HUD panel of key/value rows */
      .glass .hero {
        justify-content: center;
      }
      .glass .panel {
        width: 820px;
        border: 2px solid var(--hair);
        background: var(--panel);
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        will-change: transform, opacity;
      }
      :root[data-theme="cinematic"] .glass .panel {
        background: var(--glass);
        border-color: var(--glass-edge);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 0 60px rgba(var(--glow-rgb), 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .glass .panel .bar {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        height: 92px;
        padding: 0 var(--s-4);
        border-bottom: 2px solid var(--hair);
        font-family: var(--mono);
        font-size: var(--t-label);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .glass .panel .bar .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
        flex: 0 0 auto;
      }
      .glass .panel .bar .icon {
        margin-left: auto;
      }
      .glass .panel .row {
        display: grid;
        grid-template-columns: 300px 1fr;
        column-gap: var(--s-3);
        align-items: center;
        min-height: 112px;
        padding: var(--s-2) var(--s-4);
        border-top: 2px solid var(--hair);
        will-change: transform, opacity;
      }
      .glass .panel .row:first-of-type {
        border-top: 0;
      }
      .glass .panel .row .key {
        font-family: var(--mono);
        font-size: var(--t-label);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
      }
      .glass .panel .row .val {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 48px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-align: right;
      }
      .glass .panel .row.lit .val {
        color: var(--accent);
      }
      :root[data-theme="cinematic"] .glass .panel .row.lit .val {
        text-shadow: 0 0 22px rgba(var(--glow-rgb), 0.6);
      }
      .glass .panel .scan {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 120px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
        opacity: 0;
        pointer-events: none;
      }

      /* ---- captions: lower third (y 1376-1500) ------------------------------ */
      #captions {
        position: absolute;
        top: 1376px;
        left: var(--m);
        width: var(--content-w);
        height: 124px;
      }
      .cap {
        position: absolute;
        inset: 0;
        opacity: 0;
        font-family: var(--sans);
        font-size: var(--t-caption);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.005em;
        color: var(--ink-2);
      }
      .cap-word {
        display: inline-block;
        margin-right: 0.26em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
      <div id="paper"></div>
      <div id="floor"></div>
      <div id="haze"></div>

      <div id="chrome">
        <div id="kicker">TLDR</div>
        <div id="counter">01 / 07</div>
      </div>
      <div id="rule"><div id="progress"></div></div>

      <div id="field"></div>
      <div id="stage"><div id="wipe"></div><div id="wipe-v"></div></div>

      <div id="captions" data-layout-allow-caption-zone></div>
      <div id="vignette"></div>
      <div id="grain"></div>
      <div id="flash"></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-track-index="1"></audio>
    </div>

    <script>
      const story = JSON.parse(window.__hyperframes.getVariables().story);
      const ICONS = window.EXPLAINER_ICONS || {};
      const FPS = 30;
      const ENTER = 0.6;
      const EXIT = 0.3;
      const TRANSITION = 0.5;
      const EASE_OUT = "power3.out";
      const EASE_IN = "power2.in";
      const STAGE_W = 820;
      const STAGE_H = 1064;

      // ---- style-library hooks ---------------------------------------------
      // A scene may carry a validated `style` (newsletter_video/styles): a
      // recipe's knobs. Every knob defaults to "default" = exactly what this
      // composition does on its own, so a plan without styles renders as
      // before. Knob values are the closed sets in styles/vocabulary.py.
      const GSAP_EASES = { out: "power3.out", inOut: "power3.inOut", spring: "back.out(1.4)", linear: "none" };
      const styleOf = (s) => (s && s.style && typeof s.style === "object" ? s.style : null);
      const knob = (st, k) => (st && st[k] && st[k] !== "default" ? st[k] : null);
      const TRANSITION_ALIAS = { "wipe-down": "wipe", "push-up": "push", cut: "none" };
      function sceneTransition(j) {
        if (j <= 0) return "none";
        const t = knob(styleOf(story.scenes[j]), "transition");
        if (!t) return j % 2 ? "wipe" : "push";
        return TRANSITION_ALIAS[t] || t;
      }
      function hexToRgba(hex, alpha) {
        const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
        if (!m) return null;
        return "rgba(" + parseInt(m[1], 16) + ", " + parseInt(m[2], 16) + ", " + parseInt(m[3], 16) + ", " + alpha + ")";
      }
      // ---- cinematic look ------------------------------------------------------
      // story.theme === "cinematic" switches the ground (CSS above); the
      // recipe's glow palette fills --glow-1..4. Text in the accent must stay
      // readable on near-black, so --accent is the palette's first colour
      // lifted to a safe luminance (inkSafe) while --glow-rgb keeps it raw for
      // the halos. In the other themes the palette is ignored.
      const CINEMATIC = story.theme === "cinematic";
      function hexToRgb(hex) {
        const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
        return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
      }
      function luminance(rgb) {
        const f = (c) => (c /= 255) <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
      }
      function inkSafe(hex, minLum) {
        // Mix towards white until the colour clears `minLum` (0.3 ~ 7:1 on #050509).
        const rgb = hexToRgb(hex);
        if (!rgb) return hex;
        let out = rgb.slice();
        for (let i = 0; i < 24 && luminance(out) < (minLum || 0.3); i++) out = out.map((c) => Math.round(c + (255 - c) * 0.12));
        return "#" + out.map((c) => c.toString(16).padStart(2, "0")).join("");
      }
      const PALETTE = (Array.isArray(story.palette) ? story.palette : []).filter((c) => hexToRgb(c));
      const GLOW = ["#ff7a1a", "#ff3d8a", "#8b5cff", "#22d3ee"].map((c, i) => PALETTE[i] || PALETTE[i % Math.max(PALETTE.length, 1)] || c);
      if (CINEMATIC) {
        const rootStyle = document.documentElement.style;
        GLOW.forEach((c, i) => rootStyle.setProperty("--glow-" + (i + 1), c));
        rootStyle.setProperty("--glow-rgb", hexToRgb(GLOW[0]).join(", "));
        rootStyle.setProperty("--accent", inkSafe(GLOW[0]));
        rootStyle.setProperty("--accent-soft", hexToRgba(GLOW[0], 0.2));
      }
      function sceneAccent(hex) {
        return CINEMATIC ? inkSafe(hex) : hex;
      }
      function applyStyleClasses(root, st) {
        // Build-time (before the fit pass): type treatments, backgrounds and
        // a per-scene accent are CSS, so the text measures with them on.
        if (!st) return;
        const tt = knob(st, "type_treatment");
        if (tt === "caps") root.classList.add("st-caps");
        else if (tt === "oversized") root.classList.add("st-oversized");
        else if (tt === "sans-heavy") root.classList.add("st-sans");
        else if (tt === "outline") root.classList.add("st-outline");
        else if (tt === "highlight-band") root.classList.add("st-band");
        const bg = knob(st, "background");
        if (bg === "accent-field") root.classList.add("st-field");
        else if (bg === "dark-panel") root.classList.add("st-panel");
        if (st.accent) {
          root.style.setProperty("--accent", sceneAccent(st.accent));
          const soft = hexToRgba(st.accent, 0.14);
          if (soft) root.style.setProperty("--accent-soft", soft);
          if (CINEMATIC) root.style.setProperty("--glow-rgb", hexToRgb(st.accent).join(", "));
        }
      }

      if (story.theme === "dark" || CINEMATIC) document.documentElement.setAttribute("data-theme", story.theme);
      document.getElementById("kicker").textContent = story.kicker || "";

      const stage = document.getElementById("stage");
      const wipe = document.getElementById("wipe");
      const pad2 = (n) => String(n).padStart(2, "0");
      const SVG = "http://www.w3.org/2000/svg";

      // ---- DOM helpers -------------------------------------------------------
      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }
      function svgEl(tag, attrs) {
        const node = document.createElementNS(SVG, tag);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }
      function icon(name, size, className) {
        // A pictogram from icons.js at `size` px; returns null for unknown names.
        const paths = ICONS[name];
        if (!paths) return null;
        const svg = svgEl("svg", { viewBox: "0 0 24 24", width: size, height: size });
        svg.setAttribute("class", "icon " + (className || ""));
        paths.forEach((d) => {
          const fill = d.startsWith("f ");
          const p = svgEl("path", { d: fill ? d.slice(2) : d });
          if (fill) p.setAttribute("class", "f");
          svg.append(p);
        });
        return svg;
      }
      function words(container, text, className) {
        const spans = [];
        text.split(/\s+/).filter(Boolean).forEach((w) => {
          const span = el("span", className, w);
          container.append(span);
          spans.push(span);
        });
        return spans;
      }
      function emphasized(container, text, emphasis) {
        const idx = emphasis ? text.indexOf(emphasis) : -1;
        if (idx < 0) {
          container.append(text);
          return null;
        }
        container.append(text.slice(0, idx));
        const span = el("span", "em", emphasis);
        container.append(span, text.slice(idx + emphasis.length));
        return span;
      }
      function parseNumber(value) {
        const m = /^([^\d]*)(\d[\d,]*(?:\.\d+)?)(.*)$/.exec(value);
        if (!m) return null;
        if (/^\s?[-\u2013\u2014/:]\s?\d/.test(m[3])) return null; // a range or ratio ("22-25", "3/4") is shown, not counted
        const digits = m[2];
        const number = parseFloat(digits.replace(/,/g, ""));
        if (!isFinite(number)) return null;
        const decimals = digits.includes(".") ? digits.split(".")[1].length : 0;
        return { prefix: m[1], number, decimals, grouped: digits.includes(","), suffix: m[3] };
      }
      function formatNumber(n, spec) {
        const fixed = n.toFixed(spec.decimals);
        if (!spec.grouped) return spec.prefix + fixed + spec.suffix;
        const [whole, frac] = fixed.split(".");
        return spec.prefix + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (frac ? "." + frac : "") + spec.suffix;
      }
      function shortNumber(n, unit) {
        const spec = { prefix: "", number: n, decimals: Number.isInteger(n) ? 0 : 1, grouped: n >= 10000, suffix: unit || "" };
        return formatNumber(n, spec);
      }
      // Pre-baked frame rows (deterministic under seek): one tl.set per frame.
      function countUp(tl, node, spec, at, duration, ease) {
        if (!spec) return;
        const easeFn = gsap.parseEase(ease);
        const frames = Math.max(1, Math.round(duration * FPS));
        for (let f = 0; f <= frames; f++) {
          tl.set(node, { textContent: formatNumber(spec.number * easeFn(f / frames), spec) }, at + (f / frames) * duration);
        }
      }
      function drawable(pathEl) {
        // Measure once at build time; dashoffset tweens to 0 to draw.
        const len = pathEl.getTotalLength() * 1.02;
        pathEl.style.strokeDasharray = len;
        pathEl.style.strokeDashoffset = len;
        return len;
      }
      function drawIcon(tl, svg, at, duration) {
        if (!svg) return;
        const paths = Array.from(svg.querySelectorAll("path"));
        const strokes = paths.filter((p) => !p.classList.contains("f"));
        const fills = paths.filter((p) => p.classList.contains("f"));
        strokes.forEach((p, i) => {
          drawable(p);
          const t = at + Math.min(i * 0.09, 0.4);
          tl.to(p, { strokeDashoffset: 0, duration, ease: "power2.out" }, t);
        });
        fills.forEach((p) => {
          tl.set(p, { opacity: 0 }, 0);
          tl.to(p, { opacity: 1, duration: 0.3, ease: "power1.out" }, at + duration * 0.7);
        });
      }
      function head(title, label) {
        const h = el("div", "head");
        if (label) h.append(el("div", "el label", label));
        if (title) h.append(el("div", "el h2", title));
        return h;
      }

      // ---- scene builders --------------------------------------------------
      // Each returns { root, hero, parts, ...handles }: parts is the ordered
      // reveal list [{ node, at }] (seconds after scene start).
      const builders = {
        title(s) {
          const root = el("div", "scene title");
          const label = el("div", "el label accent", s.kicker);
          const hero = el("div", "hero");
          const ic = icon(s.icon, 400, "accent");
          if (ic) hero.append(ic);
          const display = el("div", "el display fit");
          display.dataset.fitMax = ic ? "380" : "760";
          display.dataset.fitMin = "80";
          const wordEls = words(display, s.headline, "word");
          hero.append(display);
          const foot = el("div", "foot");
          foot.append(el("div", "el label", "ByteSize News · daily tech, under a minute"));
          root.append(el("div", "head"), hero, foot);
          root.querySelector(".head").append(label);
          return { root, hero, parts: [{ node: label, at: 0.1 }, { node: foot, at: 0.9 }], wordEls, ic };
        },
        statement(s) {
          const root = el("div", "scene statement");
          const parts = [];
          const h = el("div", "head");
          if (s.label) {
            const label = el("div", "el label", s.label);
            h.append(label);
            parts.push({ node: label, at: 0.1 });
          }
          const hero = el("div", "hero");
          const h1 = el("div", "el h1 fit");
          h1.dataset.fitMax = s.icon ? "460" : "760";
          h1.dataset.fitMin = "60";
          const em = emphasized(h1, s.text, s.emphasis);
          hero.append(h1);
          parts.push({ node: h1, at: 0.2 });
          const ic = icon(s.icon, 440, "accent");
          if (ic) hero.append(ic);
          else hero.style.justifyContent = "center";
          root.append(h, hero);
          return { root, hero, parts, em, ic };
        },
        stat(s) {
          const root = el("div", "scene stat");
          const label = el("div", "el label", s.label);
          const h = el("div", "head");
          h.append(label);
          const hero = el("div", "hero");
          const spec = parseNumber(s.value);
          const value = el("div", "el value num fit-w");
          value.dataset.fitMin = "120";
          value.dataset.longest = s.value;
          value.textContent = spec ? formatNumber(0, spec) : s.value;
          const parts = [{ node: label, at: 0.1 }];
          let ring = null, fill = null, cols = [];
          const pct = spec && /^%$/.test(spec.suffix.trim()) && spec.number <= 100 ? spec.number : null;
          if (pct !== null && !(s.trend && s.trend.length)) {
            // Percentage: the number sits inside a progress ring.
            const wrap = el("div", "el ring-wrap");
            const svg = svgEl("svg", { viewBox: "0 0 200 200", class: "ring" });
            svg.append(svgEl("circle", { class: "track", cx: 100, cy: 100, r: 88 }));
            ring = svgEl("circle", { class: "fill", cx: 100, cy: 100, r: 88 });
            svg.append(ring);
            value.dataset.fitMin = "100";
            value.style.fontSize = "190px";
            wrap.append(svg, value);
            hero.append(wrap);
            parts.push({ node: wrap, at: 0.2 });
          } else {
            const rule = el("div", "el stat-rule");
            fill = el("div", "stat-fill");
            const sweep = el("div", "sweep");
            rule.append(fill, sweep);
            hero.append(value, rule);
            parts.push({ node: value, at: 0.2 }, { node: rule, at: 0.3 });
            if (s.trend && s.trend.length >= 2) {
              const trend = el("div", "el trend");
              const max = Math.max(...s.trend, 0) || 1;
              const lead = s.trend.indexOf(max);
              s.trend.forEach((v, i) => {
                const col = el("div", "col" + (i === s.trend.length - 1 ? " lead" : ""));
                col.style.height = Math.max(4, Math.round((v / max) * 300)) + "px";
                trend.append(col);
                cols.push(col);
              });
              hero.append(trend);
              parts.push({ node: trend, at: 0.4 });
            }
          }
          const foot = el("div", "foot");
          if (s.context) {
            const context = el("div", "el body fit");
            context.dataset.fitMax = "180";
            context.dataset.fitMin = "32";
            context.textContent = s.context;
            foot.append(context);
          }
          foot.append(el("div", "el label", s.source ? "Source · " + s.source : (story.kicker || "")));
          parts.push({ node: foot, at: 0.6 });
          root.append(h, hero, foot);
          return { root, hero, parts, value, spec, fill, ring, pct, cols, finalText: s.value, sweep: root.querySelector(".sweep") };
        },
        comparison(s) {
          const root = el("div", "scene comparison");
          const parts = [];
          const h = head(s.title);
          if (s.title) parts.push({ node: h, at: 0.1 });
          const hero = el("div", "hero");
          const columns = el("div", "columns");
          const left = s.left, right = s.right;
          const hasNums = [left.number, right.number].every((v) => typeof v === "number" && isFinite(v) && v > 0);
          const max = hasNums ? Math.max(left.number, right.number) : 1;
          const cols = [left, right].map((side) => {
            const col = el("div", "el col");
            if (hasNums && side.number === max && left.number !== right.number) col.classList.add("lead");
            const object = el("div", "object");
            let disc = null, ic = null;
            if (hasNums) {
              // Area-proportional discs: diameter scales with the square root.
              disc = el("div", "disc");
              const d = Math.round(374 * Math.sqrt(Math.max(side.number, 0) / max));
              disc.style.width = disc.style.height = Math.max(d, 56) + "px";
              object.append(disc);
              if (side.number === max && left.number !== right.number) {
                const ping = el("div", "ping");
                ping.style.width = ping.style.height = Math.max(d, 56) + "px";
                ping.style.inset = "auto";
                ping.style.gridArea = "1 / 1";
                object.append(ping);
              }
            } else {
              const tile = el("div", "tile");
              ic = icon(side.icon || "box", 220, "accent");
              tile.append(ic);
              object.append(tile);
            }
            col.append(object, el("div", "label", side.label));
            const value = el("div", "value num fit-w");
            value.dataset.fitMin = "48";
            value.textContent = side.value;
            col.append(value);
            if (side.note) col.append(el("div", "body note muted", side.note));
