      // ---- text fit (build time only) ------------------------------------------
      function fitAll() {
        stage.querySelectorAll(".fit").forEach((node) => {
          const max = parseFloat(node.dataset.fitMax);
          const min = parseFloat(node.dataset.fitMin);
          let size = parseFloat(getComputedStyle(node).fontSize);
          while (node.offsetHeight > max && size > min) {
            size -= 4;
            node.style.fontSize = size + "px";
          }
        });
        stage.querySelectorAll(".fit-w").forEach((node) => {
          const min = parseFloat(node.dataset.fitMin);
          const width = node.parentElement.clientWidth || STAGE_W;
          let size = parseFloat(getComputedStyle(node).fontSize);
          // A node made of word spans is measured as it is (replacing its text
          // would flatten the spans); a plain node measures its longest value.
          const plain = node.children.length === 0;
          const probe = node.textContent;
          if (plain) node.textContent = node.dataset.longest || probe;
          while (node.scrollWidth > width && size > min) {
            size -= 8;
            node.style.fontSize = size + "px";
          }
          if (plain) node.textContent = probe;
        });
      }

      // ---- timeline ----------------------------------------------------------
      function build() {
        fitAll();
        const tl = gsap.timeline({ paused: true });
        const total = story.duration;
        const n = story.scenes.length;
        const css = getComputedStyle(document.documentElement);
        const ink = css.getPropertyValue("--ink").trim();
        const ink2 = css.getPropertyValue("--ink-2").trim();
        const accent = css.getPropertyValue("--accent").trim();
        const bar = css.getPropertyValue("--bar").trim();

        tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);
        tl.fromTo("#chrome", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE_OUT }, 0.05);

        // Every revealed element is hidden from t=0 (a set, so seeking to any
        // earlier time shows nothing) and arrives at its cue.
        const enter = (node, from, at, dur, ease) => {
          tl.set(node, { opacity: 0, ...from }, 0);
          const to = { opacity: 1, duration: dur || ENTER, ease: ease || EASE_OUT };
          for (const k in from) to[k] = k === "scale" || k === "scaleY" ? 1 : 0;
          tl.to(node, to, at);
        };
        const reveal = (node, at, dy, dur) => enter(node, { y: dy == null ? 36 : dy }, at, dur);
        const cueAt = (cues, k, start, fallback) => (cues[k] != null ? Math.max(cues[k], start + 0.3) : fallback);

        built.forEach((b, i) => {
          const s = b.scene;
          const start = s.start;
          const end = s.end;
          const last = i === n - 1;
          const len = end - start;
          const cues = Array.isArray(s.cues) ? s.cues : [];
          const st = styleOf(s);
          const transition = sceneTransition(i);
          const isWipe = transition === "wipe" || transition === "wipe-left";
          // Style knobs for this scene (all inert when there is no style).
          const speed = st && st.speed > 0 ? Number(st.speed) : 1;
          const sceneEase = st && GSAP_EASES[st.ease] ? GSAP_EASES[st.ease] : null;
          const accentS = st && st.accent ? st.accent : accent;
          const T = TRANSITION / speed;
          const enterS = (node, from, at, dur, ease) => enter(node, from, at, (dur || ENTER) / speed, ease || sceneEase);
          const revealS = (node, at, dy, dur) => enterS(node, { y: dy == null ? 36 : dy }, at, dur);
          const entranceK = knob(st, "entrance");
          const holdK = knob(st, "hold");
          const bgK = knob(st, "background");
          const rowFrom = (dy) => (entranceK === "scale-pop" ? { scale: 0.7, y: 0 } : entranceK === "line-slide" ? { x: -60 } : { y: dy });

          // --- entrance of the scene container --------------------------------
          tl.set(b.root, { opacity: 1 }, start);
          tl.set("#counter", { textContent: pad2(i + 1) + " / " + pad2(n) }, start);
          if (transition === "push") {
            tl.fromTo(b.root, { y: 72 }, { y: 0, duration: T, ease: sceneEase || EASE_OUT, immediateRender: false }, start);
          } else if (transition === "wipe") {
            // Top-to-bottom reveal behind a travelling accent edge.
            tl.fromTo(b.root, { clipPath: "inset(0px 0px " + STAGE_H + "px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: T, ease: "power3.inOut", immediateRender: false }, start);
            tl.set(wipe, st && st.accent ? { opacity: 1, y: 0, backgroundColor: accentS } : { opacity: 1, y: 0 }, start);
            tl.to(wipe, { y: STAGE_H - 4, duration: T, ease: "power3.inOut" }, start);
            tl.set(wipe, { opacity: 0 }, start + T);
          } else if (transition === "push-left") {
            tl.fromTo(b.root, { x: 120 }, { x: 0, duration: T, ease: sceneEase || EASE_OUT, immediateRender: false }, start);
          } else if (transition === "wipe-left") {
            // Right-to-left reveal behind a vertical accent edge.
            const wipeV = document.getElementById("wipe-v");
            tl.fromTo(b.root, { clipPath: "inset(0px 0px 0px " + STAGE_W + "px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: T, ease: "power3.inOut", immediateRender: false }, start);
            tl.set(wipeV, { opacity: 1, x: STAGE_W - 4, backgroundColor: accentS }, start);
            tl.to(wipeV, { x: 0, duration: T, ease: "power3.inOut" }, start);
            tl.set(wipeV, { opacity: 0 }, start + T);
          } else if (transition === "zoom-through") {
            tl.fromTo(b.root, { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6 / speed, ease: sceneEase || EASE_OUT, immediateRender: false }, start);
          } else if (transition === "mask-circle") {
            tl.fromTo(b.root, { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: T, ease: "power3.inOut", immediateRender: false }, start);
            tl.set(b.root, { clipPath: "none" }, start + T);
          } else if (transition === "fade") {
            tl.fromTo(b.root, { opacity: 0 }, { opacity: 1, duration: 0.4 / speed, ease: "power1.inOut", immediateRender: false }, start);
          } else if (transition === "flash") {
            tl.set("#flash", { opacity: 1, backgroundColor: accentS }, start);
            tl.to("#flash", { opacity: 0, duration: 0.12, ease: "power1.out" }, start);
          }
          // --- backgrounds (a colour band behind the stage, a plain ground) ---
          // The band arrives with the scene's own transition and leaves with
          // the next scene's, so the ground never cuts on its own.
          if (bgK === "accent-field" || bgK === "gradient-wash") {
            const field = document.getElementById("field");
            const fieldStyle = bgK === "accent-field"
              ? { opacity: 1, background: accentS }
              : { opacity: 1, background: "linear-gradient(180deg, " + (hexToRgba(accentS, 0.22) || accentS) + ", rgba(0,0,0,0))" };
            const FULL = "inset(0px 0px 0px 0px)";
            if (transition === "wipe") {
              tl.set(field, { ...fieldStyle, clipPath: "inset(0px 0px 100% 0px)" }, start);
              tl.to(field, { clipPath: FULL, duration: T, ease: "power3.inOut" }, start);
            } else if (transition === "wipe-left") {
              tl.set(field, { ...fieldStyle, clipPath: "inset(0px 0px 0px 100%)" }, start);
              tl.to(field, { clipPath: FULL, duration: T, ease: "power3.inOut" }, start);
            } else if (transition === "fade" || transition === "zoom-through" || transition === "mask-circle") {
              tl.set(field, { ...fieldStyle, opacity: 0, clipPath: FULL }, start);
              tl.to(field, { opacity: 1, duration: 0.4 / speed, ease: "power1.inOut" }, start);
            } else {
              tl.set(field, { ...fieldStyle, clipPath: FULL }, start);
            }
            if (!last) {
              const nextT = sceneTransition(i + 1);
              if (nextT === "wipe") tl.to(field, { clipPath: "inset(100% 0px 0px 0px)", duration: T, ease: "power3.inOut" }, end);
              else if (nextT === "wipe-left") tl.to(field, { clipPath: "inset(0px 100% 0px 0px)", duration: T, ease: "power3.inOut" }, end);
              else if (nextT === "fade" || nextT === "zoom-through" || nextT === "mask-circle") tl.to(field, { opacity: 0, duration: 0.4, ease: "power1.inOut" }, Math.max(start + 0.6, end - 0.4));
              else tl.set(field, { opacity: 0 }, end);
              tl.set(field, { opacity: 0, clipPath: FULL }, end + T);
            }
          }
          if (bgK === "solid") {
            tl.set("#paper", { opacity: 0 }, start);
            if (!last) tl.set("#paper", { opacity: 1 }, end + T);
          }
          // --- hold: what keeps moving while the scene is up ------------------
          if (!holdK) {
            // Slow push-in on the hero layer with the head drifting a touch less (parallax).
            if (b.hero) tl.fromTo(b.hero, { scale: 1 }, { scale: 1.025, duration: Math.max(len, 0.1), ease: "none", immediateRender: false }, start); // ±10 px: stays inside the safe column
            const headEl = b.root.querySelector(".head");
            if (headEl) tl.fromTo(headEl, { y: 0 }, { y: -10, duration: Math.max(len, 0.1), ease: "none", immediateRender: false }, start);
          } else if (holdK === "slow-push") {
            if (b.hero) tl.fromTo(b.hero, { scale: 1 }, { scale: 1.06, duration: Math.max(len, 0.1), ease: "none", immediateRender: false }, start);
          } else if (holdK === "parallax") {
            if (b.hero) tl.fromTo(b.hero, { scale: 1 }, { scale: 1.025, duration: Math.max(len, 0.1), ease: "none", immediateRender: false }, start);
            const headEl = b.root.querySelector(".head");
            if (headEl) tl.fromTo(headEl, { y: 0 }, { y: -28, duration: Math.max(len, 0.1), ease: "none", immediateRender: false }, start);
          } else if (holdK === "float" && b.hero) {
            for (let t = start + 0.8; t + 2.4 <= end + 0.1; t += 2.4) {
              tl.to(b.hero, { y: -8, duration: 1.2, ease: "sine.inOut" }, t);
              tl.to(b.hero, { y: 0, duration: 1.2, ease: "sine.inOut" }, t + 1.2);
            }
          } else if (holdK === "pulse" && b.hero) {
            for (let t = start + 0.8; t + 0.9 <= end + 0.1; t += 0.9) {
              tl.to(b.hero, { scale: 1.03, duration: 0.45, ease: "sine.inOut" }, t);
              tl.to(b.hero, { scale: 1, duration: 0.45, ease: "sine.inOut" }, t + 0.45);
            }
          }
          // Nothing holds still: every scene gets a re-traced pictogram, a sweep,
          // a flow or a pulse through its hold (see DESIGN.md, motion tokens).
          const loopDraw = (svg, firstAt) => {
            if (!svg) return;
            drawIcon(tl, svg, firstAt, 0.8);
            const strokes = Array.from(svg.querySelectorAll("path:not(.f)"));
            for (let t = firstAt + 1.6; t < end - 0.5; t += 1.6) {
              strokes.forEach((p, k) => {
                const len = parseFloat(p.style.strokeDasharray);
                tl.set(p, { strokeDashoffset: len }, t + Math.min(k * 0.06, 0.3));
                tl.to(p, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, t + Math.min(k * 0.06, 0.3));
              });
            }
          };
          const sweepAlong = (node, width, firstAt) => {
            // A light band travelling along a bar: the "live" highlight.
            if (!node) return;
            for (let t = firstAt; t < end - 1.0; t += 1.6) {
              tl.set(node, { opacity: 1, x: -140 }, t);
              tl.to(node, { x: width, duration: 1.2, ease: "power1.inOut" }, t);
              tl.set(node, { opacity: 0 }, t + 1.2);
            }
          };
          const pingRing = (node, firstAt) => {
            if (!node) return;
            for (let t = firstAt; t < end - 1.0; t += 1.5) {
              tl.set(node, { opacity: 0.6, scale: 1 }, t);
              tl.to(node, { opacity: 0, scale: 1.22, duration: 1.1, ease: "power2.out" }, t);
            }
          };
          const dashFlow = (path, firstAt) => {
            // After a connector has drawn, its dashes keep travelling: data moving.
            const len = parseFloat(path.style.strokeDasharray);
            tl.set(path, { strokeDasharray: "22 14", strokeDashoffset: 0 }, firstAt);
            tl.to(path, { strokeDashoffset: -Math.max(len, 200) * 3, duration: Math.max(end - firstAt, 0.1), ease: "none" }, firstAt);
          };
          const waitPulse = (node, from, to) => {
            // While the voice is still on its way to the next cue, the latest
            // element breathes (a 3 % scale swell every 0.9 s) so nothing holds still.
            if (!node || to - from < 1.0) return;
            for (let t = from; t + 0.9 <= to + 0.1; t += 0.9) {
              tl.to(node, { scale: 1.03, duration: 0.45, ease: "sine.inOut" }, t);
              tl.to(node, { scale: 1, duration: 0.45, ease: "sine.inOut" }, t + 0.45);
            }
          };
          const cycleLit = (nodes, firstAt, period, prop) => {
            // The accent walks through the elements in order, over and over:
            // a border (panels, bands) or the text colour (lines, rows).
            if (!nodes.length) return;
            const key = prop || "borderColor";
            const onScreen = nodes[0] && nodes[0].closest(".frame.terminal");
            const rest = key === "color" ? (onScreen ? css.getPropertyValue("--screen-ink").trim() : ink) : ink2;
            let k = 0;
            for (let t = firstAt; t < end - 0.4; t += period) {
              nodes.forEach((n, j) => {
                const target = key === "color" ? (n.querySelector(".bar-label, .column-value") || n) : n;
                tl.to(target, { [key]: j === k % nodes.length ? accent : rest, duration: 0.25, ease: "power1.out" }, t);
              });
              k += 1;
            }
          };

          b.parts.forEach((p) => revealS(p.node, start + (isWipe ? p.at * 0.4 : p.at)));

          if (b.wordEls && s.type !== "outro") {
            const textEl = b.wordEls[0] ? b.wordEls[0].parentElement : null;
            const waveStep = st && st.stagger ? Number(st.stagger) : Math.min(0.055, 0.45 / Math.max(1, b.wordEls.length));
            if (!entranceK || entranceK === "word-wave") {
              b.wordEls.forEach((w, k) => {
                const t = start + 0.25 + k * waveStep;
                tl.set(w, { opacity: 0, y: 44 }, 0);
                tl.set(w, { opacity: 1 }, t);
                tl.to(w, { y: 0, duration: 0.5 / speed, ease: "power4.out" }, t);
              });
            } else if (entranceK === "letter-stagger") {
              b.wordEls.forEach((w, k) => {
                const t = start + 0.25 + k * waveStep;
                tl.set(w, { opacity: 0, y: -40 }, 0);
                tl.set(w, { opacity: 1 }, t);
                tl.to(w, { y: 0, duration: 0.3 / speed, ease: sceneEase || "power3.out" }, t);
              });
            } else if (entranceK === "typewriter") {
              const per = Math.min(0.12, 0.9 / Math.max(1, b.wordEls.length)) / speed;
              b.wordEls.forEach((w, k) => {
                tl.set(w, { opacity: 0 }, 0);
                tl.set(w, { opacity: 1 }, start + 0.25 + k * per);
              });
            } else if (textEl) {
              // Whole-block entrances: the words are in place, the block moves.
              const at = start + 0.25;
              if (entranceK === "line-slide") enterS(textEl, { x: -60 }, at, 0.5);
              else if (entranceK === "scale-pop") enterS(textEl, { scale: 0.6, y: 0 }, at, 0.45, sceneEase || "back.out(1.4)");
              else if (entranceK === "fade-up") enterS(textEl, { y: 24 }, at, 0.8, sceneEase || "power2.inOut");
              else if (entranceK === "blur-in") {
                tl.set(textEl, { opacity: 0, filter: "blur(24px)" }, 0);
                tl.to(textEl, { opacity: 1, filter: "blur(0px)", duration: 0.7 / speed, ease: sceneEase || "power2.out" }, at);
              } else if (entranceK === "mask-reveal") {
                tl.set(textEl, { clipPath: "inset(0px 100% 0px 0px)" }, 0);
                tl.to(textEl, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.6 / speed, ease: sceneEase || "power3.inOut" }, at);
              }
            }
          }
          if (b.ic && s.type !== "outro") loopDraw(b.ic, start + 0.35);

          if (s.type === "statement" && b.em) {
            const at = s.emphasisAt != null ? Math.max(s.emphasisAt, start + 0.5) : start + 0.9;
            if (knob(st, "type_treatment") === "highlight-band") {
              const bgColor = css.getPropertyValue("--bg").trim();
              tl.set(b.em, { backgroundColor: "rgba(0,0,0,0)", color: ink }, 0);
              tl.to(b.em, { backgroundColor: accentS, color: bgColor, duration: 0.35, ease: "power2.out" }, at);
            } else if (bgK === "accent-field") {
              tl.fromTo(b.em, { color: "#ffffff" }, { color: css.getPropertyValue("--bg").trim(), duration: 0.35, ease: "power2.out", immediateRender: false }, at);
            } else {
              tl.fromTo(b.em, { color: ink }, { color: accentS, duration: 0.35, ease: "power2.out", immediateRender: false }, at);
            }
          }
          if (knob(st, "type_treatment") === "outline") {
            // The outlined headline fills in once it has landed.
            const target = b.root.querySelector(".display, .h1");
            if (target) tl.to(target, { color: ink, duration: 0.5 / speed, ease: "power2.out" }, start + 0.9);
          }

          if (s.type === "stat") {
            const at = s.countAt != null ? Math.max(s.countAt, start + 0.35) : start + 0.5;
            const COUNT = Math.min(2.2, Math.max(1.3, (end - at) * 0.45));
            countUp(tl, b.value, b.spec, at, COUNT, "power2.out");
            sweepAlong(b.sweep, 820, at + COUNT + 0.2);
            if (!b.spec) tl.set(b.value, { textContent: b.finalText }, at);
            tl.fromTo(b.value, { scale: 0.94 }, { scale: 1, duration: COUNT, ease: "power2.out", immediateRender: false }, at);
            if (b.fill) tl.fromTo(b.fill, { scaleX: 0 }, { scaleX: 1, duration: COUNT, ease: "power2.out", immediateRender: false }, at);
            if (b.ring) {
              const len = drawable(b.ring) / 1.02;
              b.ring.style.strokeDasharray = len;
              tl.fromTo(b.ring, { strokeDashoffset: len }, { strokeDashoffset: len * (1 - b.pct / 100), duration: COUNT, ease: "power2.out", immediateRender: false }, at);
            }
            const colGap = Math.min(0.35, Math.max(0.1, ((end - at) * 0.55) / Math.max(b.cols.length, 1)));
            b.cols.forEach((col, k) => {
              tl.fromTo(col, { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, at + 0.2 + k * colGap);
            });
          }

          if (s.type === "comparison") {
            // Both columns land together (left from the left, right from the right)
            // so their baselines are always identical.
            const at = cueAt(cues, 0, start, start + 0.35);
            const at2 = cueAt(cues, 1, start, at + 0.45);
            b.cols.forEach((c, k) => {
              enterS(c.col, { x: k ? 40 : -40 }, at);
              const t = k ? at2 : at;
              if (c.disc) tl.fromTo(c.disc, { scale: 0 }, { scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, t + 0.1);
              if (c.ping) pingRing(c.ping, t + 1.1);
              if (c.ic) loopDraw(c.ic, t + 0.1);
            });
            enterS(b.root.querySelector(".vs"), {}, at + 0.3, 0.4, "power1.out");
          }

          if (s.type === "list") {
            const ats = b.rowEls.map((_, k) => cueAt(cues, k, start, start + 0.4 + k * 0.45));
            b.rowEls.forEach((r, k) => {
              const at = ats[k];
              enterS(r.row, rowFrom(28), at, 0.5);
              if (r.ic) loopDraw(r.ic, at + 0.05);
              if (k + 1 < ats.length) waitPulse(r.row, at + 0.55, ats[k + 1]);
            });
            // Once every item is up, the accent walks the list.
            cycleLit(b.rowEls.map((r) => r.row), ats[ats.length - 1] + 0.8, 0.8, "color");
          }

          if (s.type === "timeline") {
            const ats = b.stepEls.map((_, k) => cueAt(cues, k, start, start + 0.4 + k * 0.6));
            const lastAt = ats[ats.length - 1];
            tl.fromTo(b.railFill, { scaleY: 0 }, { scaleY: 1, duration: Math.max(0.6, lastAt - ats[0] + 0.4), ease: "power1.inOut", immediateRender: false }, ats[0]);
            // The marker rides the rail to each step as it is spoken.
            const railTop = b.steps.querySelector(".rail").offsetTop;
            b.stepEls.forEach((step, k) => {
              const at = ats[k];
              enterS(step.node, rowFrom(24), at, 0.5);
              const y = step.node.offsetTop + parseFloat(getComputedStyle(step.dot).top) - 20;
              if (k === 0) tl.set(b.marker, { opacity: 1, y }, at);
              else tl.to(b.marker, { y, duration: Math.min(0.6, Math.max(0.3, at - ats[k - 1] - 0.1)), ease: "power3.inOut" }, at - 0.3);
              tl.fromTo(step.dot, { scale: 0.4, borderColor: ink2 }, { scale: 1, borderColor: accent, duration: 0.45, ease: EASE_OUT, immediateRender: false }, at);
            });
            // The marker breathes a ring while it waits at a step.
            const ring = el("div", "ping");
            b.marker.append(ring);
            pingRing(ring, ats[0] + 0.5);
          }

          if (s.type === "chart") {
            if (b.kind === "line") {
              const len = drawable(b.line);
              const at = cueAt(cues, 0, start, start + 0.4);
              const lastCue = cueAt(cues, b.dots.length - 1, start, at + 1.2);
              const dur = Math.max(0.9, lastCue - at);
              tl.to(b.line, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
              tl.to(b.area, { opacity: 1, duration: 0.6, ease: "power1.out" }, at + dur * 0.5);
              b.dots.forEach((d, k) => {
                enterS(d, { scale: 0 }, at + (dur * k) / Math.max(b.dots.length - 1, 1), 0.35);
              });
              revealS(b.callout, at + dur - 0.2, 20, 0.5);
              countUp(tl, b.callout, b.spec, at + dur - 0.2, 0.8, "power2.out");
            } else if (b.kind === "dots") {
              let t0 = start + 0.3;
              b.groups.forEach((g, k) => {
                const at = cueAt(cues, k, start, t0);
                revealS(g.row, at, 20, 0.5);
                const dur = Math.min(1.1, 0.25 + g.cells.length * 0.012);
                g.cells.forEach((c, j) => {
                  tl.fromTo(c, { backgroundColor: bar, scale: 0.6 }, { backgroundColor: g.color.startsWith("var") ? css.getPropertyValue(g.color.slice(4, -1)).trim() : g.color, scale: 1, duration: 0.3, ease: EASE_OUT, immediateRender: false }, at + (dur * j) / Math.max(g.cells.length, 1));
                });
                countUp(tl, g.value, g.spec, at, dur, "power2.out");
                t0 = at + dur + 0.2;
              });
            } else {
              b.items.forEach((it, k) => {
                const at = cueAt(cues, k, start, start + 0.45 + k * 0.3);
                enterS(it.row, rowFrom(20), at, 0.45);
                if (k + 1 < b.items.length) waitPulse(it.row, at + 1.1, cueAt(cues, k + 1, start, start + 0.45 + (k + 1) * 0.3));
                if (it.axis === "x") {
                  tl.fromTo(it.bar, { scaleX: 0 }, { scaleX: Math.max(0.02, it.ratio), duration: 0.9, ease: "power3.out", immediateRender: false }, at + 0.1);
                  const barWidth = it.track.clientWidth - 160;
                  tl.fromTo(it.value, { x: 0 }, { x: Math.max(0.02, it.ratio) * barWidth, duration: 0.9, ease: "power3.out", immediateRender: false }, at + 0.1);
                } else {
                  tl.fromTo(it.bar, { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, at + 0.1);
                }
                countUp(tl, it.value, it.spec, at + 0.1, 0.9, "power3.out");
              });
              const lead = b.items.find((it) => it.row.classList.contains("lead")) || b.items[b.items.length - 1];
              if (lead && lead.axis === "x") {
                const sweep = el("div", "sweep");
                lead.bar.append(sweep);
                const lastAt = cueAt(cues, b.items.length - 1, start, start + 0.45 + (b.items.length - 1) * 0.3);
                sweepAlong(sweep, lead.track.clientWidth, lastAt + 1.2);
              } else if (lead) {
                const lastAt = cueAt(cues, b.items.length - 1, start, start + 0.45 + (b.items.length - 1) * 0.3);
                cycleLit(b.items.map((it) => it.row), lastAt + 1.2, 0.7, "color");
              }
            }
          }

          if (s.type === "diagram") {
            if (b.kind === "hub") {
              enterS(b.center, { scale: 0.6 }, start + 0.3, 0.6);
              b.nodes.forEach((node, k) => {
                const at = cueAt(cues, k, start, start + 0.7 + k * 0.35);
                drawable(b.connectors[k]);
                tl.to(b.connectors[k], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, at - 0.2);
                enterS(node, { scale: 0.8 }, at, 0.5);
                dashFlow(b.connectors[k], at + 0.3);
                if (k + 1 < b.nodes.length) waitPulse(node, at + 0.55, cueAt(cues, k + 1, start, start + 0.7 + (k + 1) * 0.35) - 0.2);
              });
            } else if (b.kind === "flow") {
              b.nodes.forEach((node, k) => {
                const at = cueAt(cues, k, start, start + 0.4 + k * 0.6);
                enterS(node, rowFrom(28), at, 0.5);
                if (k + 1 < b.nodes.length) waitPulse(node, at + 0.55, cueAt(cues, k + 1, start, start + 0.4 + (k + 1) * 0.6) - 0.25);
                if (k) {
                  drawable(b.connectors[k - 1]);
                  tl.to(b.connectors[k - 1], { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, at - 0.25);
                  drawable(b.heads[k - 1]);
                  tl.to(b.heads[k - 1], { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, at - 0.05);
                  dashFlow(b.connectors[k - 1], at + 0.2);
                }
              });
              const lastFlow = cueAt(cues, b.nodes.length - 1, start, start + 0.4 + (b.nodes.length - 1) * 0.6);
              cycleLit(b.nodes, lastFlow + 0.8, 0.8);
            } else if (b.kind === "stack") {
              b.nodes.forEach((node, k) => {
                const at = cueAt(cues, k, start, start + 0.4 + k * 0.45);
                enterS(node, { y: 40, scaleY: 0.9 }, at, 0.55);
                if (k + 1 < b.nodes.length) waitPulse(node, at + 0.6, cueAt(cues, k + 1, start, start + 0.4 + (k + 1) * 0.45));
              });
              cycleLit(b.nodes, cueAt(cues, b.nodes.length - 1, start, start + 0.4 + (b.nodes.length - 1) * 0.45) + 0.8, 0.8);
            } else {
              b.nodes.forEach((band, k) => {
                const at = cueAt(cues, k, start, start + 0.4 + k * 0.45);
                enterS(band, { scaleY: 0.6 }, at, 0.55);
                if (k + 1 < b.nodes.length) waitPulse(band, at + 0.6, cueAt(cues, k + 1, start, start + 0.4 + (k + 1) * 0.45));
              });
              cycleLit(b.nodes, cueAt(cues, b.nodes.length - 1, start, start + 0.4 + (b.nodes.length - 1) * 0.45) + 0.8, 0.8);
            }
          }

          if (s.type === "device") {
            enterS(b.frame, { y: 48, scale: 0.97 }, start + 0.2, 0.7);
            b.lineEls.forEach((line, k) => {
              const at = cueAt(cues, k, start, start + 0.8 + k * 0.55);
              if (b.kind === "terminal") {
                // Types on character by character (discrete states, seek-safe).
                const full = line.dataset.full;
                const textEl = line.querySelector(".text");
                const caret = line.querySelector(".caret");
                const perChar = Math.min(0.045, 0.9 / Math.max(full.length, 1));
                tl.set(line, { opacity: 1 }, at);
                tl.set(caret, { opacity: 1 }, at);
                for (let c = 1; c <= full.length; c++) tl.set(textEl, { textContent: full.slice(0, c) }, at + c * perChar);
                const done = at + full.length * perChar;

                const next = k + 1 < b.lineEls.length ? cueAt(cues, k + 1, start, start + 0.8 + (k + 1) * 0.55) : end;

                  tl.set(caret, { opacity: 1 }, Math.min(t + 0.5, next - 0.05));
                }
                tl.set(caret, { opacity: 0 }, next - 0.05);
              } else {
                const fromX = b.kind === "chat" ? (k % 2 ? 40 : -40) : 0;
                enterS(line, fromX ? { x: fromX } : { y: 28 }, at, 0.5);
                if (k + 1 < b.lineEls.length) waitPulse(line, at + 0.55, cueAt(cues, k + 1, start, start + 0.8 + (k + 1) * 0.55));
                const meter = line.querySelector(".meter i");
                if (meter) {
                  // Live metrics: each meter settles, then re-levels every couple of seconds.
                  let level = 0.35 + ((k * 37) % 60) / 100;
                  tl.fromTo(meter, { scaleX: 0 }, { scaleX: level, duration: 0.8, ease: "power2.out", immediateRender: false }, at + 0.2);
                  for (let t = at + 2.2, j = 1; t < end - 0.8; t += 1.8, j++) {
                    level = 0.3 + (((k + j) * 41) % 65) / 100;
                    tl.to(meter, { scaleX: level, duration: 0.9, ease: "power2.inOut" }, t);
                  }
                }
                if (b.kind !== "laptop") {
                  const lastAt = cueAt(cues, b.lineEls.length - 1, start, start + 0.8 + (b.lineEls.length - 1) * 0.55);
                  if (k === b.lineEls.length - 1) cycleLit(b.lineEls, lastAt + 0.9, 0.8, "color");
                }
              }
            });
            if (b.kind === "terminal") {

              // Once everything has typed, the accent walks the lines like a selection.
              const lastAt = cueAt(cues, b.lineEls.length - 1, start, start + 0.8 + (b.lineEls.length - 1) * 0.55);
              const typed = lastAt + Math.min(0.045, 0.9 / Math.max(b.lineEls[b.lineEls.length - 1].dataset.full.length, 1)) * b.lineEls[b.lineEls.length - 1].dataset.full.length;

          }

          if (s.type === "outro") {

            const step = Math.min(0.06, 0.45 / Math.max(1, b.wordEls.length));
            b.wordEls.forEach((w, k) => {
              const t = start + 0.9 + k * step;

              tl.set(w, { opacity: 1 }, t);
              tl.to(w, { y: 0, duration: 0.5, ease: "power4.out" }, t);

            // Typing dots: a conversation starting, until the end of the video.

            enterS(b.cta, { y: 36 }, ctaAt, 0.6);
            for (let t = ctaAt + 0.9; t < end - 0.5; t += 1.4) {

            let lastEnd = start;

            }

            b.lineEls.forEach((l, k) => {
              tl.set(l.line, { opacity: 1 }, 0);

              l.wordEls.forEach((w, j) => {

                tl.set(w, { opacity: 1 }, t);

            tl.fromTo(b.underline, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, ats[ats.length - 1] + 0.4);

            b.underline.style.overflow = "hidden";

          }

          if (s.type === "glass") {
            enterS(b.panel, { y: 40, scale: 0.97 }, start + 0.2, 0.7);
            if (b.ic) loopDraw(b.ic, start + 0.4);
            const ats = b.rowEls.map((_, k) => cueAt(cues, k, start, start + 0.8 + k * 0.5));
            b.rowEls.forEach((row, k) => {
              enterS(row, rowFrom(20), ats[k], 0.45);
              if (k + 1 < ats.length) waitPulse(row, ats[k] + 0.5, ats[k + 1]);
            });
            // status dot blinks (a readout that is live), the scan sweeps once the rows are up
            for (let t = start + 0.6; t < end - 0.3; t += 1.0) {
              tl.to(b.dot, { opacity: 0.25, duration: 0.5, ease: "sine.inOut" }, t);
              tl.to(b.dot, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, t + 0.5);
            }
            const panelH = b.panel.offsetHeight || 600;
            for (let t = ats[ats.length - 1] + 1.0; t < end - 1.2; t += 2.2) {
              tl.set(b.scan, { opacity: 1, y: -120 }, t);
              tl.to(b.scan, { y: panelH, duration: 1.4, ease: "power1.inOut" }, t);
              tl.set(b.scan, { opacity: 0 }, t + 1.4);
            }
            cycleLit(b.rowEls, ats[ats.length - 1] + 1.0, 0.8, "borderColor");
            b.rowEls.forEach((row, k) => {

              let kk = 0;
              for (let t = ats[ats.length - 1] + 1.0; t < end - 0.4; t += 0.8, kk++) {

              }
            });
          }

          if (!last) {

            const nextSpeed = nextSt && nextSt.speed > 0 ? Number(nextSt.speed) : 1;
            const Tn = TRANSITION / nextSpeed;
            if (nextTransition === "push") {

            } else if (nextTransition === "wipe") {

            } else if (nextTransition === "wipe-left") {
              tl.fromTo(b.root, { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px " + STAGE_W + "px 0px 0px)", duration: Tn, ease: "power3.inOut", immediateRender: false }, end);

              tl.set(b.root, { opacity: 0 }, end);

            tl.set(b.root, { opacity: 0, y: 0, x: 0, scale: 1, clipPath: "inset(0px 0px 0px 0px)" }, end + Tn);
          }
        });

        (story.captions || []).forEach((chunk, c) => {
          const { node, spans } = caps[c];
          tl.set(node, { opacity: 1 }, chunk.start);
          tl.fromTo(node, { y: 10 }, { y: 0, duration: 0.2, ease: EASE_OUT, immediateRender: false }, chunk.start);
          tl.set(node, { opacity: 0 }, chunk.end);
          chunk.at.forEach((at, w) => tl.set(spans[w], { color: ink }, at));
          tl.set(spans, { color: ink2 }, 0);
        });

        window.__timelines["main"] = tl;
      }

      // ---- Three.js: object3d scenes drawn from HyperFrames time ------------
      // The runtime dispatches `hf-seek` with the time of every frame it
      // captures; each object3d scene renders its own small WebGL canvas from
      // that time alone (no clocks, no animation loop), so a frame is a pure
      // function of t like the GSAP timeline. Three is loaded once from the
      // CDN (like gsap); the hold registered on window.__hf.buildReady keeps
      // the first capture until the scenes exist. If the import fails the
      // legend still shows and the canvas stays empty.
      const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
      const threeScenes = story.scenes.filter((s) => s.type === "object3d");
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const threeReady = threeScenes.length
        ? import(THREE_URL).then((THREE) => setupThree(THREE)).catch((err) => console.warn("three.js unavailable: " + err))
        : Promise.resolve();
      window.__hf.buildReady["explainer-three"] = threeReady;

      function setupThree(THREE) {
        const glow = GLOW.map((c) => new THREE.Color(c));
        const cinematic = CINEMATIC;
        const plateColor = new THREE.Color(cinematic ? "#0b0e1e" : "#ffffff");
        const inkColor = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#17191e");
        const W = 820, H = 560;
        const ease = gsap.parseEase("power3.out");
        const prog = (t, at, dur) => ease(Math.min(1, Math.max(0, (t - at) / (dur || 0.7))));
        // A rounded-rect ring (a neon frame) and its plate, as flat meshes.

          s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);

          const ring = new THREE.Mesh(new THREE.ShapeGeometry(outer, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 }));
          group.add(ring);

          [[1.6, 0.35], [2.6, 0.14]].forEach(([k, o]) => {
            const halo = roundedRect(w + thick * (k - 1) * 2, h + thick * (k - 1) * 2, 0.26);
            halo.holes.push(new THREE.Path().setFromPoints(roundedRect(w - thick * (k + 1), h - thick * (k + 1), 0.14).getPoints(12)));
            const m = new THREE.Mesh(new THREE.ShapeGeometry(halo, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
            m.position.z = -0.002;
            group.add(m);
          });
          const plate = new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(w - thick, h - thick, 0.2), 12),
            new THREE.MeshBasicMaterial({ color: plateColor, transparent: true, opacity: cinematic ? 0.55 : 0.9, depthWrite: false }));
          plate.position.z = -0.004;
          group.add(plate);

        }
        function glowSprite(color, size) {

          c.width = c.height = 128;

          grad.addColorStop(0, "rgba(255,255,255,0.9)");
          grad.addColorStop(0.25, "#" + color.getHexString());
          grad.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, 128, 128);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));

        }

          renderer.setClearColor(0x000000, 0);
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

            // stack turns slowly.

                o.position.y = (k - (n - 1) / 2) * gap + (1 - p) * -1.6;

              camera.position.z = 7.4 - Math.min(1, Math.max(0, (t - s.start) / Math.max(s.end - s.start, 1))) * 0.5;
            };
          } else if (s.kind === "bars") {
            const maxV = Math.max(...s.series.map((p) => p.value), 0) || 1;
            const bw = Math.min(0.9, 4.4 / n), gapX = 5.2 / n;
            s.series.forEach((p, k) => {
              const h = 0.3 + (p.value / maxV) * 3.4;
              const color = k === s.highlight ? glow[0] : glow[2 % glow.length];
              const box = new THREE.Mesh(new THREE.BoxGeometry(bw, h, bw),
                new THREE.MeshStandardMaterial({ color: cinematic ? "#0d1024" : "#ffffff", emissive: color, emissiveIntensity: k === s.highlight ? 0.55 : 0.25, roughness: 0.4, metalness: 0.1, transparent: true }));
              const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color, transparent: true }));
              const g = new THREE.Group();

              objects.push(g);
            });

            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.95;
            rig.add(floor);
            camera.position.set(0, 2.6, 8.2);
            camera.lookAt(0, -0.2, 0);
            draw = (t) => {
              const c = cues();
              objects.forEach((o, k) => {

                o.children.forEach((ch) => { ch.material.opacity = Math.min(1, p * 1.5); });

            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.012, 8, 120), new THREE.MeshBasicMaterial({ color: inkColor, transparent: true, opacity: 0.35 }));
            ring.rotation.x = Math.PI / 2;
            rig.add(ring);
            for (let k = 0; k < n; k++) {
              const node = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 16), new THREE.MeshBasicMaterial({ color: glow[k % glow.length], transparent: true }));
              node.add(glowSprite(glow[k % glow.length], 1.5));
              rig.add(node);
              objects.push(node);
            }
            rig.rotation.x = 0.55;
            camera.position.set(0, 1.2, 8.4);
            camera.lookAt(0, 0, 0);
            draw = (t) => {
              const c = cues();
              const spin = (t - s.start) * 0.35;
              objects.forEach((o, k) => {
                const p = prog(t, c[k] != null ? c[k] : s.start + 0.5 + k * 0.4, 0.7);
                const a = spin + (k * Math.PI * 2) / n;
                o.position.set(Math.cos(a) * 2.6, 0, Math.sin(a) * 2.6);
                o.scale.setScalar(Math.max(0.001, p));
                o.material.opacity = p;
                o.children[0].material.opacity = p;
              });
              core.scale.setScalar(1 + 0.04 * Math.sin((t - s.start) * 2.2));
            };
          } else {
            // cards: floating glass plates in depth, drifting on their own phases
            for (let k = 0; k < n; k++) {
              const card = neonFrame(2.6, 1.6, glow[k % glow.length], 0.05);
              card.position.set((k % 2 ? 1.1 : -1.1) * (1 + (k >> 1) * 0.15), 1.1 - k * 0.75, -k * 1.1);
              card.rotation.set(-0.15, (k % 2 ? -0.35 : 0.35), 0);
              rig.add(card);
              objects.push(card);
            }
            camera.position.set(0, 0.4, 7.6);
            camera.lookAt(0, 0, -1);
            draw = (t) => {
              const c = cues();
              objects.forEach((o, k) => {
                const p = prog(t, c[k] != null ? c[k] : s.start + 0.4 + k * 0.45, 0.8);
                const base = 1.1 - k * 0.75;
                o.position.y = base + (1 - p) * -0.9 + Math.sin((t - s.start) * 0.8 + k * 1.7) * 0.08;
                o.rotation.y = (k % 2 ? -0.35 : 0.35) + Math.sin((t - s.start) * 0.5 + k) * 0.06;
                setOpacity(o, p);
              });
              camera.position.z = 7.8 - Math.min(1, Math.max(0, (t - s.start) / Math.max(s.end - s.start, 1))) * 0.6;
            };
          }
          b.renderAt = (t) => {
            draw(t);
            renderer.render(scene, camera);
          };
          b.renderAt(s.start);
        });
        const active = built.filter((b) => b.renderAt);
        window.addEventListener("hf-seek", (event) => {
          const t = event.detail.time;
          active.forEach((b) => {
            if (t >= b.scene.start - 0.6 && t <= b.scene.end + 0.6) b.renderAt(t);
          });
        });
        active.forEach((b) => b.renderAt(window.__hfThreeTime || 0));
      }

      document.fonts.ready.then(build);
    </script>
  </body>
</html>
