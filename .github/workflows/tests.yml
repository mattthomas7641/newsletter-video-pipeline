name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
      - name: Install
        run: pip install -r requirements-cloud.txt
      - name: Test
        # No API keys, no browser, no GPU: the suite fakes every outside service.
        run: python -m pytest -q
